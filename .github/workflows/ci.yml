name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run kernel test suite
        run: python3 tests/test_kernel.py
      - name: Run guard test suite
        run: python3 tests/test_guard.py
      - name: Run MCP server test suite
        run: python3 tests/test_mcp_server.py
      - name: Run CLI test suite
        run: python3 tests/test_cli.py
      - name: Check installer syntax
        run: node --check install.js && node --check update.js
