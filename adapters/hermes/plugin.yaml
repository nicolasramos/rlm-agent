name: rlm
version: 0.1.0
description: "RLM (Recursive Language Model) for Hermes: persistent Python kernel (ipython), context lake (rlm_store/get/search/find/stats/forget), kernel snapshot/restore, and background subagents (rlm). Keeps large data out of the LLM prompt."
author: Nicolás Ramos
kind: standalone
provides_tools:
  - ipython
  - rlm_store
  - rlm_get
  - rlm_search
  - rlm_find
  - rlm_stats
  - rlm_forget
  - rlm_snapshot
  - rlm_restore
  - rlm
  - rlm_result
  - rlm_list
provides_hooks:
  - on_session_end
license: MIT
homepage: https://github.com/nicolasramos/rlm-agent
tags: [rlm, kernel, context, subagents]
